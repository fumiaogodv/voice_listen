<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NoteToSpeech</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <!-- 左侧栏 -->
  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="logo">N2S</span>
      <div class="sidebar-actions">
        <button id="btn-upload" class="icon-btn" title="上传笔记文件">⬆</button>
        <button id="btn-refresh" class="icon-btn" title="重新扫描">⟳</button>
      </div>
    </div>
    <input type="file" id="file-input" multiple accept=".md,.txt,.markdown" style="display:none">
    <div id="file-list" class="file-list"></div>
  </aside>

  <!-- 主区 -->
  <main id="main">
    <!-- 顶部悬浮播放器 -->
    <div id="player" class="player">
      <div class="player-title" id="player-title">未选择文件</div>
      <div class="player-controls">
        <button id="btn-back" class="ctl-btn">−10s</button>
        <button id="btn-play" class="ctl-btn ctl-play">▶</button>
        <button id="btn-fwd" class="ctl-btn">+10s</button>
        <button id="btn-rate" class="ctl-btn">1.0x</button>
        <button id="btn-locate" class="ctl-btn on" title="点击切换：自动跟随播放 / 锁定浏览">跟随中</button>
      </div>
      <div class="player-progress" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-dot" id="progress-dot"></div>
      </div>
      <div class="player-time">
        <span id="time-cur">00:00</span>
        <span id="time-dur">00:00</span>
      </div>
    </div>

    <!-- 文字区 -->
    <div id="text-area" class="text-area">
      <div id="text-list" class="text-list">
        <div class="placeholder">左侧选择一个文件开始播放</div>
      </div>
    </div>
  </main>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="/static/app.js"></script>
</body>
</html>
